<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Muhammad Muneeb Lone" />
    <title>Calculator</title>
    <style>
      label {
        display: block;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <h2>Calculator</h2>

    <label for="operand1">Operand-1:</label>
    <input type="number" id="operand1" />

    <label for="operator">Operator (+, -, *, /):</label>
    <input type="text" id="operator" />

    <label for="operand2">Operand-2:</label>
    <input type="number" id="operand2" />

    <button onclick="calculate()">Calculate</button>

    <p id="result">Result:</p>

    <script>
      function calculate() {
        // Get input values
        var operand1 = parseFloat(document.getElementById("operand1").value);
        var operand2 = parseFloat(document.getElementById("operand2").value);
        var operator = document.getElementById("operator").value;

        if (isNaN(operand1) || isNaN(operand2)) {
          document.getElementById("result").innerHTML =
            "Please enter valid numbers.";
          return;
        }
        var result;
        switch (operator) {
          case "+":
            result = operand1 + operand2;
            break;
          case "-":
            result = operand1 - operand2;
            break;
          case "*":
            result = operand1 * operand2;
            break;
          case "/":
            if (operand2 !== 0) {
              result = operand1 / operand2;
            } else {
              document.getElementById("result").innerHTML =
                "Cannot divide by zero!";
              return;
            }
            break;
          default:
            document.getElementById("result").innerHTML =
              "Invalid operator. Please use +, -, *, or /.";
            return;
        }

        document.getElementById("result").innerHTML = "Result: " + result;
      }
    </script>
  </body>
</html>
